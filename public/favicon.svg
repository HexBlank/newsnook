<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  shape-rendering="geometricPrecision"
>
  <title>NewsNook favicon — two-color crane, square, tight crop</title>
  <desc>Square favicon version with white rounded background and tighter crop so the subject fills the visible area better.</desc>

  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="512" height="512" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- 白底微圆角 -->
  <rect x="0" y="0" width="512" height="512" rx="28" ry="28" fill="#FFFFFF"/>

  <!-- 重新计算后的主体：为 favicon 做更紧的方形裁切 -->
  <g clip-path="url(#clip)" transform="matrix(1.44824 0 0 1.44824 -34.758 0)">
    <!-- 深蓝 -->
    <path
      d="M 0 0
         L 267.104 162.399
         L 151.013 256.793
         Z"
      fill="#18324A"
    />
    <path
      d="M 267.104 162.399
         L 151.013 256.793
         L 94.779 353.532
         Z"
      fill="#18324A"
    />
    <path
      d="M 272.729 172.167
         L 353.755 104.205
         L 312.814 250.496
         Z"
      fill="#18324A"
    />
    <path
      d="M 353.755 104.205
         L 400.062 142.621
         L 344.028 140.813
         Z"
      fill="#18324A"
    />

    <!-- 砖橙 -->
    <path
      d="M 267.104 162.399
         L 312.814 250.496
         L 94.779 353.532
         Z"
      fill="#A24A34"
    />
    <path
      d="M 109.196 238.100
         L 151.013 256.793
         L 94.779 353.532
         Z"
      fill="#A24A34"
    />
  </g>
</svg>