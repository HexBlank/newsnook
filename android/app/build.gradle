apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv("NEWSNOOK_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("NEWSNOOK_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NEWSNOOK_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NEWSNOOK_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is not configured. Run `npm run android:keystore:init` or provide NEWSNOOK_KEYSTORE_* environment variables."
    )
}

// 唯一版本源：web/package.json 的 "version"（与产物文件名 newsnook-<ver>-release.* 一致）
def packageJsonFile = file("../../package.json")
if (!packageJsonFile.exists()) {
    throw new GradleException("package.json not found at ${packageJsonFile.canonicalPath}")
}
def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.getText('UTF-8'))
def packageVersion = (packageJson.version ?: '').toString().trim()
if (!(packageVersion ==~ /^\d+\.\d+\.\d+/)) {
    throw new GradleException("package.json version must start with semver X.Y.Z, got: ${packageVersion}")
}
def semverCore = (packageVersion =~ /^(\d+)\.(\d+)\.(\d+)/)[0]
def derivedVersionCode =
    (semverCore[1] as int) * 10000 + (semverCore[2] as int) * 100 + (semverCore[3] as int)
// 仅当 Play 需要「同名 versionName 再提一次 versionCode」时才用环境变量覆盖
def appVersionCode = Integer.parseInt(System.getenv("NEWSNOOK_VERSION_CODE") ?: "${derivedVersionCode}")
def appVersionName = System.getenv("NEWSNOOK_VERSION_NAME") ?: packageVersion

android {
    namespace = "com.aizeek.newsnook"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "translation"
    productFlavors {
        // 不链接 ML Kit / Bergamot：适合默认分发，保留云翻译。
        cloud {
            dimension "translation"
            externalNativeBuild {
                cmake {
                    arguments "-DENABLE_BERGAMOT=OFF"
                }
            }
        }
        // 链接 ML Kit + Bergamot/Marian：提供模型下载和完全离线翻译。
        local {
            dimension "translation"
            // Bergamot/Marian 依赖 bionic iconv 与 glob（API 28+）
            minSdkVersion 28
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    arguments "-DANDROID_STL=c++_shared", "-DENABLE_BERGAMOT=ON"
                }
            }
        }
    }
    defaultConfig {
        applicationId "com.aizeek.newsnook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/local/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// cloud flavor 不需要原生引擎；禁用其 CMake/Ninja 任务以免空跑。
afterEvaluate {
    tasks.matching { task ->
        def name = task.name.toLowerCase()
        (name.contains("externalnativebuild") || name.contains("cmake")) && name.contains("cloud")
    }.configureEach { task ->
        task.enabled = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    localImplementation 'com.google.mlkit:translate:17.0.3'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
